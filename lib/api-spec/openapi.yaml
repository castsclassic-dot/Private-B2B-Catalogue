openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Authenticated catalogue operations
  - name: admin
    description: Admin-only catalogue management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [catalogue]
      summary: Get public Supabase client configuration
      responses:
        "200":
          description: Public Supabase URL and anon key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /catalogue/products:
    get:
      operationId: listProducts
      tags: [catalogue]
      summary: List catalogue products
      responses:
        "200":
          description: Products visible to the authenticated catalogue user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
  /catalogue/summary:
    get:
      operationId: getCatalogueSummary
      tags: [catalogue]
      summary: Get catalogue summary
      responses:
        "200":
          description: Summary counts for the authenticated catalogue user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueSummary"
        "401":
          description: Authentication required
  /admin/vendors:
    get:
      operationId: listVendors
      tags: [admin]
      summary: List vendors
      responses:
        "200":
          description: Vendors managed by the authenticated admin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List products for administration
      responses:
        "200":
          description: Products managed by the authenticated admin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthConfig:
      type: object
      required: [url, anonKey]
      properties:
        url: { type: string }
        anonKey: { type: string }
    Vendor:
      type: object
      required: [id, name, code, productCount]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        productCount: { type: number }
    Product:
      type: object
      required: [id, sku, name, category, material, vendorName, imageUrl]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        material: { type: string }
        description: { type: ["string", "null"] }
        vendorName: { type: string }
        imageUrl: { type: ["string", "null"] }
        isPublished: { type: boolean }
    CatalogueSummary:
      type: object
      required: [productCount, vendorCount, categories]
      properties:
        productCount: { type: number }
        vendorCount: { type: number }
        categories:
          type: array
          items: { type: string }

